name: "CD - Deploy"
on:
  push:
    branches: [dev, qa, master]
jobs:
  deploy-dev:
    name: "Deploy Development"
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: { name: development }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          echo "=== DEPLOY A DEVELOPMENT ==="
          echo "Commit: ${{ github.sha }}"
          APP_ENV=development python app.py
          echo "Deploy a Development completado"
  deploy-qa:
    name: "Deploy QA"
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    environment: { name: qa }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          echo "=== DEPLOY A QA ==="
          echo "Commit: ${{ github.sha }}"
          APP_ENV=qa python app.py
          echo "Deploy a QA completado"
  deploy-prod:
    name: "Deploy Production"
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: { name: production }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          echo "=== DEPLOY A PRODUCTION ==="
          echo "Commit: ${{ github.sha }}"
          APP_ENV=production python app.py
          echo "Deploy a Production completado"
